[project]
name = "lc-engine"
version = "0.2.0"
description = "Adaptive engine of the family learning companion: memory model, planner, missions, knowledge map, learning by heart, reminders."
requires-python = ">=3.12"
dependencies = [
    "fsrs>=6.3,<7",
]

[project.optional-dependencies]
# Personal fitting of the memory model (server side): the fsrs-rs optimizer, as used by Anki.
fit = ["fsrs-rs-python>=0.9,<1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lc_engine"]
