[project]
name = "lc-ingest"
version = "0.2.0"
description = "Lesson photo (or a notion parents flagged) -> knowledge units and questions, with Claude vision and structured outputs."
requires-python = ">=3.12"
dependencies = [
    "lc-engine",
    "anthropic>=0.131",
    "pydantic>=2.9",
]

[project.scripts]
lc-extract = "lc_ingest.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lc_ingest"]

[tool.uv.sources]
lc-engine = { workspace = true }
